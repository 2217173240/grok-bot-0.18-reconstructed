name: repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  GIT_LFS_SKIP_SMUDGE: '1'
  TMPDIR: ${{ github.workspace }}/.cache/ci-tmp

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # 安装包通过 LFS pointer 校验；源码 CI 保留仓库中的 pointer。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          lfs: false
          fetch-depth: 0
      - name: Prepare repository-local scratch
        run: mkdir -p "$TMPDIR"
      - name: Reject tracked runtime credentials and session data
        run: node scripts/check-publication-inputs.mjs
      - name: Scan Git history with verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$TMPDIR/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $TMPDIR/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$TMPDIR/gitleaks.tar.gz" -C "$TMPDIR" gitleaks
          "$TMPDIR/gitleaks" git --redact=100 --no-banner --log-opts=--all
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.5.0
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Prepare the pinned Electron CDP runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb libgtk-3-0t64 libnss3 libasound2t64
          node node_modules/electron/install.js
          test -f node_modules/electron/path.txt
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Run source and publication checks
        run: xvfb-run --auto-servernum npm run check
      - name: Build the editable frontend
        run: npm run frontend:build
      - name: Verify a fresh clean-history export is lossless
        run: npm run publication:check
