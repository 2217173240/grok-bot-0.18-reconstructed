name: repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Installer blobs are verified via LFS pointer oid in tests, not by downloading 280MB.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.5.0
          cache: npm
      - name: Install the locked dependency graph
        run: npm ci --no-audit --no-fund
      - name: Run source and publication checks
        run: npm run check
      - name: Build the editable frontend
        run: npm run frontend:build
      - name: Verify a fresh clean-history export is lossless
        run: npm run publication:check
